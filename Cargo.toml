[workspace]
# Explicit: a virtual root infers no resolver from its members' editions and falls back to 1.
resolver = "3"
members = ["crates/*"]
# fixtures is test-only, so a release build never compiles it.
default-members = [
    "crates/dat-parser",
    "crates/function-calculator",
    "crates/lca-calculator",
    "crates/ncbi",
    "crates/tables-generator",
    "crates/taxdmp-parser",
    "crates/uniprot-parser",
    "crates/uniprot-parser-tryptic",
    "crates/utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches unipept-api and unipept-index, so one toolchain builds all three.
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.97"
bit-vec = "0.10.1"
chrono = "0.4.40"
clap = { version = "4.5.35", features = ["derive"] }
crossbeam-channel = "0.5.15"
regex = "1.10.2"
strum = { version = "0.28.0", features = ["derive"] }
