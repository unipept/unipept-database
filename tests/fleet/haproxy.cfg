# The load balancer of the rehearsal: the two backends a rollout drains, each server in both, and
# their health routes. Production's TLS, rate limits and ACLs are left out; pept2prot, which reads
# OpenSearch, is routed to db_handlers so both backends carry the poller's requests.
global
    log /dev/log local0
    stats socket /run/haproxy/admin.sock mode 660 group haproxy level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  60s

frontend api
    bind *:80
    use_backend db_handlers if { path_beg /api/v2/pept2prot }
    default_backend all_handlers

backend all_handlers
    balance leastconn
    option httpchk
    http-check send meth GET uri /health
    server s1 s1:80 check inter 2s fall 3 rise 2
    server s2 s2:80 check inter 2s fall 3 rise 2

backend db_handlers
    balance leastconn
    option httpchk
    http-check send meth GET uri /health/database
    server s1 s1:80 check inter 2s fall 3 rise 2
    server s2 s2:80 check inter 2s fall 3 rise 2
