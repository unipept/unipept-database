# Builds the suffix-array tables from SwissProt and publishes them as their own release. The static
# database keeps the latest release: unipept-desktop reads it from there.
name: Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  generate_tsv_files:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # rust-toolchain.toml pins a nightly for rustfmt; the binaries are built on stable.
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Get current date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      - name: Install required utilities
        run: |
          sudo apt-get update
          sudo apt-get -y install git curl unzip gawk pv wget uuid-runtime pigz lz4 parallel libxml2-utils
      - name: Prepare temporary directories
        run: mkdir -p "output" "unipept-temp"
      # Actions starts steps with SIGPIPE ignored; luz relies on its default action.
      - name: Generate the tables
        shell: bash
        run: env --default-signal=PIPE ./pipelines/suffix-array/build.sh --database-sources "swissprot" --output-dir "output" --temp-dir "unipept-temp"
      - name: Verify the tables
        shell: bash
        run: |
          # No pipefail: lz4 stops with SIGPIPE when head has read enough.
          set -eu
          test -s output/.version || { echo ".version is missing or empty; refusing to publish"; exit 1; }
          for table in taxons lineages uniprot_entries ec_numbers go_terms interpro_entries proteomes; do
            file="output/$table.tsv.lz4"
            test -f "$file" || { echo "$file is missing; refusing to publish"; exit 1; }
            test -n "$(lz4 -dc "$file" 2> /dev/null | head -c 1)" || { echo "$file has no rows; refusing to publish"; exit 1; }
          done
          columns=$(lz4 -dc output/uniprot_entries.tsv.lz4 2> /dev/null | head -n 1 | awk -F '\t' '{ print NF }')
          test "$columns" -eq 8 || { echo "uniprot_entries has $columns columns, expected 8; refusing to publish"; exit 1; }
      - name: Zip the tables
        shell: bash
        run: cd output && zip -r "../suffix_array.zip" ./* && zip -u "../suffix_array.zip" ".version"
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: suffix_array.zip
          tag_name: suffix-array-${{ env.date }}
          name: Suffix array tables ${{ env.date }}
          target_commitish: ${{ github.sha }}
          make_latest: false
