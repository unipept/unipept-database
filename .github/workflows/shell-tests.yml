# The suites in tests/, which run the shell scripts in containers or against stand-ins.
# Path-filtered, so never make these required checks: a check that never starts blocks a merge.
name: Shell tests

on:
  push:
    branches: [master]
    paths:
      - '.deploy/**'
      - 'pipelines/**'
      - 'opensearch/**'
      - 'tests/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/shell-tests.yml'
  pull_request:
    paths:
      - '.deploy/**'
      - 'pipelines/**'
      - 'opensearch/**'
      - 'tests/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/shell-tests.yml'
  workflow_dispatch:

# A new push to a pull request cancels the older run. Runs on master are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  pipelines:
    # lz() and luz() against a stand-in lz4. No container.
    name: Pipeline suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Actions starts steps with SIGPIPE ignored; the suite needs its default action.
      - name: Run the pipeline suite
        run: env --default-signal=PIPE tests/run-tests.sh lz

  verify:
    # .deploy/verify.sh against a fixture index directory. No container.
    name: Verify suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the verify suite
        run: tests/run-tests.sh verify

  shell:
    # The helpers in pipelines/lib/common.sh. No container.
    name: Shell library suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install gawk and lz4
        run: sudo apt-get update && sudo apt-get install -y gawk lz4

      - name: Run the shell library suite
        run: tests/run-tests.sh shell

  build:
    # pipelines/suffix-array/build.sh end to end, with every source replaced by a local file.
    name: Build suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the pipeline's tools
        run: sudo apt-get update && sudo apt-get install -y gawk lz4 pigz pv libxml2-utils zip unzip uuid-runtime

      # Actions starts steps with SIGPIPE ignored; luz relies on its default action.
      - name: Run the build suite
        run: env --default-signal=PIPE tests/run-tests.sh build

  seam:
    # .deploy/build.sh over the real pipeline, with every source replaced by a local file. The
    # container suite stubs the pipeline, so this is what holds the contract between the two.
    name: Deploy over the real pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # python3-requests because build.sh checks the loader's dependencies before it starts, even
      # though this suite stands the loader in.
      - name: Install the pipeline's tools
        run: sudo apt-get update && sudo apt-get install -y gawk lz4 pigz pv libxml2-utils zip unzip uuid-runtime python3-requests

      - name: Run the seam suite
        run: env --default-signal=PIPE tests/run-tests.sh seam

  deploy:
    # .deploy/build.sh and clone.sh in a container, over a real ssh and scp.
    name: Deploy suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the deploy suite
        run: tests/run-tests.sh deploy

  opensearch:
    # opensearch/load.sh against a real OpenSearch in a container.
    name: OpenSearch suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the OpenSearch suite
        run: tests/run-tests.sh opensearch
