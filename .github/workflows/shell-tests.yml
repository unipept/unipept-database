# The suites in tests/, which run the shell scripts in containers or against stand-ins.
# Path-filtered, so never make these required checks: a check that never starts blocks a merge.
name: Shell tests

on:
  push:
    branches: [main]
    paths:
      - 'pipelines/**'
      - 'opensearch/**'
      - 'tests/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/shell-tests.yml'
      # After the paths above, so it wins: a README change runs no suite.
      - '!**/*.md'
  pull_request:
    paths:
      - 'pipelines/**'
      - 'opensearch/**'
      - 'tests/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/shell-tests.yml'
      # After the paths above, so it wins: a README change runs no suite.
      - '!**/*.md'
  workflow_dispatch:

# A new push to a pull request cancels the older run. Runs on main are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipelines:
    # lz() and luz() against a stand-in lz4. Needs nothing installed.
    name: Pipeline suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Actions starts steps with SIGPIPE ignored; the suite needs its default action.
      - name: Run the pipeline suite
        run: env --default-signal=PIPE tests/run-tests.sh lz

  shell:
    # The helpers in pipelines/lib/common.sh. No container.
    name: Shell library suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install gawk and lz4
        run: sudo apt-get update && sudo apt-get install -y gawk lz4

      - name: Run the shell library suite
        run: tests/run-tests.sh shell

  build:
    # pipelines/suffix-array/build.sh and pipelines/umgap/build.sh end to end, with every source
    # replaced by a local file. One job, so the umgap suite reuses what the first compiled rather
    # than building the workspace again.
    name: Build and umgap suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install the pipeline's tools
        run: sudo apt-get update && sudo apt-get install -y gawk lz4 pigz pv libxml2-utils zip unzip uuid-runtime

      # Actions starts steps with SIGPIPE ignored; luz relies on its default action.
      - name: Run the build suite
        run: env --default-signal=PIPE tests/run-tests.sh build

      # rust-cache keeps ~/.cargo/bin, so a cached run skips the install.
      - name: Install umgap
        if: ${{ !cancelled() }}
        run: cargo install --locked umgap --version 1.2.0

      - name: Run the umgap suite
        if: ${{ !cancelled() }}
        run: env --default-signal=PIPE tests/run-tests.sh umgap

  opensearch:
    # opensearch/load.sh against a real OpenSearch in a container.
    name: OpenSearch suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run the OpenSearch suite
        run: tests/run-tests.sh opensearch
